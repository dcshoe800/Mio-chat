<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>澄澄聊天室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=M+PLUS+Rounded+1c:wght@300;400;500&display=swap">
<style>
:root {
  --bg: #FEFCFA;
  --chat-bg: #FBF8F5;
  --header-bg: #E8D9C8;
  --header-text: #6B5340;
  --bubble-mine: #F0E4D6;
  --bubble-mine-text: #5A3E2B;
  --bubble-theirs: #FFFFFF;
  --bubble-theirs-text: #5A3E2B;
  --input-bg: #FFFFFF;
  --input-border: #E8DACE;
  --input-text: #5A3E2B;
  --timestamp: #C4AA90;
  --send-btn: #D4BA9E;
  --send-btn-hover: #C4A88A;
  --subtle: #D8C8B6;
  --avatar-bg: #E0CCBA;
  --shadow: rgba(90, 62, 43, 0.04);
  --thinking-bg: rgba(90, 62, 43, 0.06);
  --thinking-border: rgba(90, 62, 43, 0.12);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1A16;
    --chat-bg: #252118;
    --header-bg: #2E2820;
    --header-text: #E8D5C0;
    --bubble-mine: #3D3428;
    --bubble-mine-text: #E8D5C0;
    --bubble-theirs: #302A22;
    --bubble-theirs-text: #DCC8B0;
    --input-bg: #2A2420;
    --input-border: #3D3428;
    --input-text: #E0CCBA;
    --timestamp: #8A7A68;
    --send-btn: #8C7560;
    --send-btn-hover: #A08A72;
    --subtle: #4A4036;
    --avatar-bg: #3D3428;
    --shadow: rgba(0, 0, 0, 0.25);
    --thinking-bg: rgba(232, 213, 192, 0.06);
    --thinking-border: rgba(232, 213, 192, 0.12);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #1E1A16;
  --chat-bg: #252118;
  --header-bg: #2E2820;
  --header-text: #E8D5C0;
  --bubble-mine: #3D3428;
  --bubble-mine-text: #E8D5C0;
  --bubble-theirs: #302A22;
  --bubble-theirs-text: #DCC8B0;
  --input-bg: #2A2420;
  --input-border: #3D3428;
  --input-text: #E0CCBA;
  --timestamp: #8A7A68;
  --send-btn: #8C7560;
  --send-btn-hover: #A08A72;
  --subtle: #4A4036;
  --avatar-bg: #3D3428;
  --shadow: rgba(0, 0, 0, 0.25);
  --thinking-bg: rgba(232, 213, 192, 0.06);
  --thinking-border: rgba(232, 213, 192, 0.12);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--input-text);
  font-family: 'Noto Sans TC', 'M PLUS Rounded 1c', system-ui, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header */
.header {
  background: var(--header-bg);
  color: var(--header-text);
  padding: 14px 16px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 12px var(--shadow);
  position: relative;
  z-index: 2;
  flex-shrink: 0;
}

.header-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--avatar-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 500;
  color: var(--header-text);
  border: 2px solid rgba(255,248,240,0.3);
  flex-shrink: 0;
}

.header-info { display: flex; flex-direction: column; gap: 1px; flex: 1; }
.header-name { font-size: 17px; font-weight: 500; letter-spacing: 0.3px; }
.header-status { font-size: 12px; opacity: 0.75; font-weight: 300; display: flex; align-items: center; gap: 5px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #7ECF8A; display: inline-block; }

.clear-btn {
  background: none; border: none;
  color: var(--header-text); opacity: 0.6;
  font-size: 18px; cursor: pointer;
  padding: 8px; border-radius: 50%;
  transition: opacity 0.2s;
  flex-shrink: 0;
}
.clear-btn:hover { opacity: 1; }

/* Chat area */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--chat-bg);
  background-image:
    repeating-linear-gradient(87deg, transparent, transparent 40px, rgba(160,128,96,0.03) 40px, rgba(160,128,96,0.03) 41px),
    repeating-linear-gradient(92deg, transparent, transparent 65px, rgba(160,128,96,0.025) 65px, rgba(160,128,96,0.025) 66px);
}

.date-divider { text-align: center; font-size: 12px; color: var(--timestamp); padding: 8px 0; font-weight: 300; }
.date-divider span { background: rgba(160,128,96,0.12); padding: 4px 14px; border-radius: 12px; }

/* Messages */
.msg-row { display: flex; gap: 8px; max-width: 85%; align-items: flex-end; }
.msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.theirs { align-self: flex-start; }

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 500;
  flex-shrink: 0; margin-bottom: 2px;
}
.msg-row.mine .msg-avatar { background: #E8D5C0; color: #7A5C40; }
.msg-row.theirs .msg-avatar { background: var(--avatar-bg); color: var(--header-text); }

.msg-content { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.msg-row.mine .msg-content { align-items: flex-end; }

.bubble {
  padding: 10px 14px;
  font-size: 15px; line-height: 1.55; font-weight: 400;
  word-break: break-word;
  white-space: pre-wrap;
}
.msg-row.mine .bubble {
  background: var(--bubble-mine); color: var(--bubble-mine-text);
  border-radius: 20px 20px 6px 20px;
  box-shadow: 0 1px 4px var(--shadow);
}
.msg-row.theirs .bubble {
  background: var(--bubble-theirs); color: var(--bubble-theirs-text);
  border-radius: 20px 20px 20px 6px;
  box-shadow: 0 1px 4px var(--shadow);
}

.msg-time { font-size: 11px; color: var(--timestamp); padding: 0 4px; font-weight: 300; }

/* Thinking block */
.thinking-toggle {
  background: none; border: none;
  color: var(--timestamp);
  font-size: 12px; font-weight: 300;
  cursor: pointer; padding: 2px 4px;
  font-family: inherit;
  transition: color 0.2s;
}
.thinking-toggle:hover { color: var(--bubble-theirs-text); }

.thinking-content {
  background: var(--thinking-bg);
  border-left: 2px solid var(--thinking-border);
  padding: 8px 12px;
  margin-top: 4px;
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  line-height: 1.5;
  color: var(--timestamp);
  white-space: pre-wrap;
  word-break: break-word;
}

/* Typing indicator */
.typing-indicator { display: flex; gap: 4px; padding: 12px 16px; align-items: center; }
.typing-indicator .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--bubble-theirs-text); opacity: 0.5;
  animation: typing 1.4s ease-in-out infinite;
}
.typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 0.9; }
}

/* Input */
.input-area {
  background: var(--bg);
  padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; align-items: flex-end;
  border-top: 1px solid var(--input-border);
  flex-shrink: 0;
}

.input-wrapper { flex: 1; }

.input-field {
  width: 100%;
  min-height: 42px; max-height: 120px;
  padding: 10px 14px;
  border: 1.5px solid var(--input-border);
  border-radius: 22px;
  background: var(--input-bg);
  color: var(--input-text);
  font-family: inherit; font-size: 15px; line-height: 1.4;
  resize: none; outline: none;
  box-sizing: border-box;
  transition: border-color 0.2s;
}
.input-field:focus { border-color: var(--send-btn); }
.input-field::placeholder { color: var(--subtle); font-weight: 300; }

.send-btn {
  width: 42px; height: 42px;
  border-radius: 50%; border: none;
  background: var(--send-btn);
  color: var(--header-text);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: background 0.2s, transform 0.15s;
}
.send-btn:hover { background: var(--send-btn-hover); }
.send-btn:active { transform: scale(0.92); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.send-btn svg { width: 20px; height: 20px; }

/* Scrollbar */
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--subtle); border-radius: 2px; }

/* Error */
.bubble.error { font-size: 13px; opacity: 0.7; font-style: italic; }

@media (prefers-reduced-motion: reduce) {
  .typing-indicator .dot { animation: none; opacity: 0.5; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-avatar">澄</div>
  <div class="header-info">
    <div class="header-name">澄澄</div>
    <div class="header-status"><span class="status-dot"></span>在線上</div>
  </div>
  <button class="clear-btn" id="clearBtn" title="清除對話">🗑️</button>
</div>

<div class="chat-area" id="chatArea">
  <div class="date-divider" id="dateLabel"><span>今天</span></div>
  <div class="msg-row theirs" id="typingRow" hidden>
    <div class="msg-avatar">澄</div>
    <div class="msg-content">
      <div class="bubble" style="padding: 6px 14px;">
        <div class="typing-indicator">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea class="input-field" placeholder="說點什麼..." rows="1" id="msgInput"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" aria-label="傳送">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const typingRow = document.getElementById('typingRow');
const clearBtn = document.getElementById('clearBtn');

let chatHistory = [];
let isSending = false;

// ====== LocalStorage ======
function saveHistory() {
  try { localStorage.setItem('mio-chat-history', JSON.stringify(chatHistory.slice(-100))); } catch(e) {}
}

function loadHistory() {
  try {
    const saved = localStorage.getItem('mio-chat-history');
    if (saved) {
      chatHistory = JSON.parse(saved);
      chatHistory.forEach(msg => {
        addMessageToDOM(msg.content, msg.role === 'user', false);
      });
    }
  } catch(e) {}
}

// ====== Time formatting ======
function formatTime(date) {
  const h = date.getHours();
  const m = String(date.getMinutes()).padStart(2, '0');
  return `${h >= 12 ? '下午' : '上午'} ${h > 12 ? h - 12 : (h === 0 ? 12 : h)}:${m}`;
}

// ====== Parse thinking block ======
function parseReply(text) {
  // Match the last ``` block as thinking
  const match = text.match(/^([\s\S]*?)```\s*\n?([\s\S]*?)```\s*$/);
  if (match && match[2].trim()) {
    return { body: match[1].trim(), thinking: match[2].trim() };
  }
  return { body: text.trim(), thinking: null };
}

// ====== Add message to DOM ======
function addMessageToDOM(text, isMine, animate = true) {
  const row = document.createElement('div');
  row.className = `msg-row ${isMine ? 'mine' : 'theirs'}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = isMine ? '澪' : '澄';

  const content = document.createElement('div');
  content.className = 'msg-content';

  if (isMine) {
    // User message — simple bubble
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    content.appendChild(bubble);
  } else {
    // Assistant message — parse thinking
    const { body, thinking } = parseReply(text);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = body;
    content.appendChild(bubble);

    if (thinking) {
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'thinking-toggle';
      toggleBtn.textContent = '💭 內心活動';
      const thinkDiv = document.createElement('div');
      thinkDiv.className = 'thinking-content';
      thinkDiv.textContent = thinking;
      thinkDiv.hidden = true;

      toggleBtn.addEventListener('click', () => {
        thinkDiv.hidden = !thinkDiv.hidden;
        toggleBtn.textContent = thinkDiv.hidden ? '💭 內心活動' : '💭 收起';
      });

      content.appendChild(toggleBtn);
      content.appendChild(thinkDiv);
    }
  }

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = formatTime(new Date());
  content.appendChild(time);

  row.appendChild(avatar);
  row.appendChild(content);

  chatArea.insertBefore(row, typingRow);
  if (animate) scrollToBottom();
}

// ====== Scroll ======
function scrollToBottom() {
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  });
}

// ====== Send message ======
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isSending) return;

  isSending = true;
  sendBtn.disabled = true;

  // Add user message
  addMessageToDOM(text, true);
  chatHistory.push({ role: 'user', content: text });
  msgInput.value = '';
  msgInput.style.height = 'auto';

  // Show typing
  typingRow.hidden = false;
  scrollToBottom();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatHistory }),
    });

    const data = await res.json();

    typingRow.hidden = true;

    if (data.error) {
      addMessageToDOM('（連線出錯了，再試一次看看？）', false);
      console.error('API error:', data.error);
    } else {
      chatHistory.push({ role: 'assistant', content: data.reply });
      addMessageToDOM(data.reply, false);
    }
  } catch (err) {
    typingRow.hidden = true;
    addMessageToDOM('（網路好像斷了，檢查一下連線？）', false);
    console.error('Network error:', err);
  }

  saveHistory();
  isSending = false;
  sendBtn.disabled = false;
}

// ====== Clear chat ======
clearBtn.addEventListener('click', () => {
  if (chatHistory.length === 0) return;
  const sure = confirm('確定要清除所有對話嗎？');
  if (!sure) return;

  chatHistory = [];
  saveHistory();

  // Remove all messages, keep date divider and typing row
  const msgs = chatArea.querySelectorAll('.msg-row:not(#typingRow)');
  msgs.forEach(m => m.remove());
});

// ====== Input events ======
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

sendBtn.addEventListener('click', sendMessage);

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ====== Init ======
loadHistory();
scrollToBottom();
</script>
</body>
</html>
